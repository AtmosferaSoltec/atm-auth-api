# Despliegue directo con atm-deploy (Mac -> VPS, sin GitHub Actions). Ver ../../tools/atm-deploy.
APP_DIR=/opt/auth-api
PREBUILT=builder

fast_checks() {
	test -z "$(gofmt -l .)" || { gofmt -l .; return 1; }
	go vet ./...
}

fast_build() {
	go_build ./cmd/api builder/out/auth-api
	go_build ./cmd/genkey builder/out/genkey
}
