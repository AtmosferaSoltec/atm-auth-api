# Production stack. Copied to /opt/auth-api by GitHub Actions on every deploy;
# never edited by hand on the server.
#
# It never builds: the image is built once in CI and published to GHCR.
# The real .env lives only on the server (/opt/auth-api/.env).
#
# No database here: PostgreSQL is a separate stack (`atm-postgres`) reachable
# through the external network `atm-network`. In DATABASE_URL the host is the
# container name, not localhost.
#
# There is no separate migrate service: the app applies its pending migrations
# when it starts, before it listens.

networks:
  shared:
    name: atm-network
    external: true

services:
  app:
    image: ghcr.io/atmosferasoltec/atm-auth-api:${IMAGE_TAG:-latest}
    container_name: auth-api
    env_file: .env
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
    # Loopback only: nginx publishes it to the outside.
    ports:
      - "127.0.0.1:3130:8080"
    networks:
      - shared
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    # Each login hashes with argon2id (19 MiB), so leave room for a few at once.
    mem_limit: 256m
