services:
  postgres:
    image: postgres:17-alpine
    container_name: atm-auth-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: atm_auth
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - atm_auth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d atm_auth"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  atm_auth_pgdata:
